name: Full Stack CI
 
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx 
        uses: docker/setup-buildx-action@v3
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Trivy Filesystem Scan  
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs 
          scan-ref: .

      - name: SonarQube Scan 
        uses: SonarSource/sonarqube-scan-action@v5
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY_BACKEND }}:latest ./backend
          docker push ${{ secrets.ECR_REPOSITORY_BACKEND }}:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.ECR_REPOSITORY_FRONTEND }}:latest ./frontend
          docker push ${{ secrets.ECR_REPOSITORY_FRONTEND }}:latest

      - name: Trivy Backend Image Scan 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-app:v1 
          format: table
          exit-code: 0

      - name: Trivy Frontend Image scan 
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: frontend-app:v1
          format: table
          exit-code: 0
